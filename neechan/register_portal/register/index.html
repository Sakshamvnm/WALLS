<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#f1f6ef">
		<title>Create account | Neechan</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<main class="page-shell">
			<header class="site-mark" aria-label="Neechan">
				<span class="mark-icon" aria-hidden="true">N</span>
				<span>neechan</span>
			</header>

			<section class="signup" aria-labelledby="page-title">
				<div class="intro">
					<p class="eyebrow">YOUR SPACE STARTS HERE</p>
					<h1 id="page-title">Create your account<span>.</span></h1>
					<p class="intro-copy">A few details and you’re on your way.</p>
				</div>

				<form id="register-form" class="register-form">
					<div class="field-grid">
						<div class="field">
							<label for="name">Full name</label>
							<input id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Alex Morgan" required>
						</div>

						<div class="field">
							<label for="dob">Date of birth</label>
							<input id="dob" name="dob" type="date" autocomplete="bday" required>
						</div>

						<div class="field field-wide">
							<label for="email">Email address</label>
							<input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
						</div>

						<div class="field">
							<label for="password">Password</label>
							<input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
						</div>

						<div class="field">
							<label for="confirm-password">Confirm password</label>
							<input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Enter it again" required>
						</div>

						<div class="field field-wide captcha-field">
							<label for="captcha-answer">Quick check <span class="label-note">Solve the sum to continue</span></label>
							<div class="captcha-row">
								<output id="captcha-question" class="captcha-question" aria-live="polite"></output>
								<span class="equals" aria-hidden="true">=</span>
								<input id="captcha-answer" name="captcha-answer" type="number" inputmode="numeric" aria-label="Answer to the math problem" placeholder="?" required>
								<button id="new-question" class="refresh-button" type="button" aria-label="Get a new math problem" title="Get a new math problem">↻</button>
							</div>
						</div>
					</div>

					<p id="form-message" class="form-message" role="status" aria-live="polite"></p>
					<button class="submit-button" type="submit">Create account <span aria-hidden="true">→</span></button>
					<p class="login-prompt">Already have an account? <a href="../login-page/account.html">Log in</a></p>
				</form>
			</section>

			<footer class="page-footer">© Neechan</footer>
		</main>

		<script>
			const form = document.querySelector('#register-form');
			const password = document.querySelector('#password');
			const confirmPassword = document.querySelector('#confirm-password');
			const captchaQuestion = document.querySelector('#captcha-question');
			const captchaAnswer = document.querySelector('#captcha-answer');
			const formMessage = document.querySelector('#form-message');
			const captchaButton = document.querySelector('#new-question');
			let captchaLoaded = false;

			async function readJsonResponse(response) {
				try {
					return JSON.parse(await response.text());
				} catch {
					throw new Error('The registration endpoint returned PHP or HTML instead of JSON. Open this page through PHP-enabled Apache and check the register_user.php URL.');
				}
			}

			async function setCaptcha() {
				captchaLoaded = false;
				captchaButton.disabled = true;
				try {
					const response = await fetch('../register_user.php?action=captcha');
					const result = await readJsonResponse(response);
					if (!response.ok) throw new Error(result.error || 'Could not load a math question.');
					captchaQuestion.textContent = result.question;
					captchaAnswer.value = '';
					captchaLoaded = true;
				} catch (error) {
					formMessage.textContent = error.message;
					formMessage.classList.add('is-error');
				}
				captchaButton.disabled = false;
			}

			captchaButton.addEventListener('click', setCaptcha);
			confirmPassword.addEventListener('input', () => {
				confirmPassword.setCustomValidity(
					confirmPassword.value && confirmPassword.value !== password.value
						? 'Passwords do not match.'
						: ''
				);
			});
			password.addEventListener('input', () => {
				confirmPassword.dispatchEvent(new Event('input'));
			});

			form.addEventListener('submit', (event) => {
				event.preventDefault();
				formMessage.classList.remove('is-error');
				if (!captchaLoaded) {
					formMessage.textContent = 'Wait for the math question to load before continuing.';
					formMessage.classList.add('is-error');
					return;
				}

				const submitButton = form.querySelector('.submit-button');
				submitButton.disabled = true;
				fetch('../register_user.php', { method: 'POST', body: new FormData(form) })
					.then(async (response) => {
						const result = await readJsonResponse(response);
						if (!response.ok) throw new Error(result.error || 'Account creation failed.');
						formMessage.textContent = result.message;
						form.reset();
						setCaptcha();
					})
					.catch((error) => {
						formMessage.textContent = error.message;
						formMessage.classList.add('is-error');
						setCaptcha();
					})
					.finally(() => {
						submitButton.disabled = false;
					});
			});

			setCaptcha();
		</script>
	</body>
</html>
